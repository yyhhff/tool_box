<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>annual_report_reader 行业龙头年报带读</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --txt:#22262b; --sub:#7a828c; --brand:#2f6fed; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h1 .dot { color:var(--brand); }
  .sub { color:var(--sub); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  input[type=text],input[type=number] { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .row { display:flex; gap:12px; align-items:end; flex-wrap:wrap; }
  .row > div { min-width:120px; }
  .opts { display:flex; gap:16px; margin-top:12px; font-size:13px; color:var(--sub); align-items:center; flex-wrap:wrap; }
  .opts label { display:flex; align-items:center; gap:6px; margin:0; font-size:13px; }
  button { padding:9px 18px; border:0; border-radius:6px; background:var(--brand); color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { background:#c9ccd1; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--txt); border:1px solid var(--line); padding:5px 12px; font-size:12px; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; }
  .chip { user-select:none; font-size:13px; padding:5px 12px; border:1px solid var(--line); border-radius:16px; cursor:pointer; color:var(--sub); background:#fff; }
  .chip.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  #log { background:#1e2229; color:#cdd3dc; font-family:Consolas,monospace; font-size:12px; line-height:1.7; border-radius:8px; padding:12px; height:220px; overflow:auto; white-space:pre-wrap; }
  .banner { display:none; padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:13px; }
  .banner.err { display:block; background:#fdecef; color:#b3213a; }
  .banner.ok { display:block; background:#e8f7ee; color:#177245; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--sub); font-weight:600; background:#fafbfc; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#f0f4ff; }
  .bar { height:8px; background:#e9ecf1; border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:var(--brand); width:0%; transition:width .4s; }
  .meta { font-size:12px; color:var(--sub); margin:4px 0 10px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(20,22,26,.45); z-index:10; padding:24px; }
  .overlay.open { display:block; }
  .modal { background:#fff; max-width:860px; margin:0 auto; border-radius:10px; padding:24px 28px; max-height:calc(100vh - 48px); overflow:auto; }
  .report { font-size:14px; line-height:1.85; }
  .report h1 { font-size:19px; margin:10px 0 8px; }
  .report h2 { font-size:16px; margin:18px 0 8px; border-left:4px solid var(--brand); padding-left:10px; }
  .report h3 { font-size:14px; margin:12px 0 6px; }
  .report table { border:1px solid var(--line); margin:8px 0; }
  .report th,.report td { border:1px solid var(--line); }
  .report blockquote { color:var(--sub); border-left:3px solid var(--line); margin:8px 0; padding:2px 12px; font-size:13px; }
  .report em { color:var(--sub); }
  .empty { color:var(--sub); font-size:13px; text-align:center; padding:18px 0; }
  .pill { font-size:12px; padding:2px 10px; border-radius:10px; display:inline-block; }
  .pill.done { background:#e8f7ee; color:#177245; }
  .pill.error,.pill.no_report { background:#fdecef; color:#b3213a; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot">&#9679;</span> annual_report_reader 行业龙头年报带读</h1>
  <div class="sub">申万一级 31 行业 &times; 每行业市值前 N 龙头 &middot; 批量年报带读 &middot; 有记忆（无新年报自动跳过）</div>

  <div id="banner" class="banner"></div>

  <div class="card">
    <h2>选择范围 <span id="snap-info" style="font-weight:normal;color:var(--sub);font-size:12px"></span></h2>
    <div style="margin-bottom:6px">
      <button class="ghost" id="btn-all">全选 31 行业</button>
      <button class="ghost" id="btn-none">清空（= 全部行业）</button>
      <span class="meta" id="last-run" style="display:inline-block;margin:0"></span>
    </div>
    <div id="chips"><span class="empty">行业快照加载中（首次约 1-3 分钟）...</span></div>
    <div class="row" style="margin-top:10px">
      <div><label>每行业龙头数 top_n</label><input type="number" id="top_n" value="3" min="1" max="8" style="width:90px"></div>
      <div><label>额外指定公司代码（逗号分隔，可空）</label><input type="text" id="stocks" placeholder="600519,000858" style="width:240px"></div>
      <div><label>GLM 模型（可空）</label><input type="text" id="model" placeholder="glm-4-flash" style="width:160px"></div>
      <div style="align-self:end"><button id="btn-start">开始分析</button></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="force"> 强制重跑（忽略记忆跳过）</label>
      <span>需先设置环境变量 ZHIPU_API_KEY；全量约 93 家，建议夜间运行</span>
    </div>
  </div>

  <div class="card">
    <h2>进度 <span id="prog-text" style="font-weight:normal;color:var(--sub);font-size:12px"></span></h2>
    <div class="bar"><i id="prog-bar"></i></div>
    <div class="meta" id="prog-current">&nbsp;</div>
    <div id="log"></div>
  </div>

  <div class="card">
    <h2>历史报告</h2>
    <div class="meta">单公司报告（点击阅读）</div>
    <table id="t-companies"><thead><tr>
      <th>代码</th><th>公司</th><th>行业</th><th>年报年份</th><th>状态</th><th>更新时间</th>
    </tr></thead><tbody></tbody></table>
    <div class="meta" style="margin-top:14px">行业对比汇总（点击阅读）</div>
    <table id="t-industries"><thead><tr><th>文件</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="modal-title" style="font-size:17px;margin:0">报告</h2>
      <button class="ghost" onclick="document.getElementById('overlay').classList.remove('open')">关闭</button>
    </div>
    <div class="report" id="modal-body"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let allIndustries = [];
let selected = new Set();

function banner(msg, kind) {
  const el = $('banner');
  el.className = 'banner ' + (kind || 'err');
  el.textContent = msg || '';
}

async function loadIndustries() {
  const r = await fetch('/api/industries');
  const j = await r.json();
  if (!j.ok) {
    $('snap-info').textContent = '行业快照生成中，请稍候...';
    setTimeout(loadIndustries, 3000);
    return;
  }
  allIndustries = j.industries;
  $('snap-info').textContent = `行业快照更新于 ${j.updated_at}`;
  $('last-run').textContent = j.last_run
    ? `上次范围：${j.last_run.mode === 'stocks' ? '指定公司' : (j.last_run.industries.length ? j.last_run.industries.join('、') : '全部行业')}（${j.last_run.ts}）` : '';
  renderChips();
  loadHistory();
}

function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  allIndustries.forEach(ind => {
    const c = document.createElement('span');
    c.className = 'chip' + (selected.has(ind.name) ? ' on' : '');
    const top = ind.stocks.slice(0, 3).map(s => s.name).join('/');
    c.textContent = `${ind.name}（${top}…）`;
    c.title = '市值前 8：' + ind.stocks.map(s => `${s.name} ${s.code}`).join('、');
    c.onclick = () => {
      selected.has(ind.name) ? selected.delete(ind.name) : selected.add(ind.name);
      c.classList.toggle('on');
    };
    box.appendChild(c);
  });
}

$('btn-all').onclick = () => { allIndustries.forEach(i => selected.add(i.name)); renderChips(); };
$('btn-none').onclick = () => { selected.clear(); renderChips(); };

$('btn-start').onclick = async () => {
  const body = {
    industries: [...selected],
    stocks: $('stocks').value.trim() ? $('stocks').value.split(',').map(s => s.trim()).filter(Boolean) : [],
    top_n: parseInt($('top_n').value) || null,
    model: $('model').value.trim(),
    force: $('force').checked,
  };
  const r = await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!j.ok) return banner(j.error, 'err');
  banner('任务已开始，下方实时显示进度', 'ok');
  pollStatus();
};

let polling = false;
async function pollStatus() {
  if (polling) return;
  polling = true;
  while (true) {
    const j = await (await fetch('/api/status')).json();
    $('log').textContent = (j.logs || []).join('\n');
    $('log').scrollTop = $('log').scrollHeight;
    const total = j.total || 0, done = j.done || 0;
    $('prog-bar').style.width = total ? Math.round(done / total * 100) + '%' : '0%';
    $('prog-text').textContent = total ? `${done}/${total}` : '';
    $('prog-current').textContent = j.current || '';
    if (j.error) banner(j.error, 'err');
    if (!j.running) { polling = false; loadHistory(); return; }
    await new Promise(res => setTimeout(res, 2000));
  }
}

async function loadHistory() {
  const j = await (await fetch('/api/history')).json();
  const tb = $('t-companies').querySelector('tbody');
  tb.innerHTML = '';
  (j.companies || []).forEach(e => {
    const tr = document.createElement('tr');
    const pill = `<span class="pill ${e.status}">${e.status === 'done' ? '完成' : (e.status === 'error' ? '失败' : '无年报')}</span>`;
    tr.innerHTML = `<td>${e.code}</td><td>${e.name || ''}</td><td>${e.industry || ''}</td><td>${e.year || ''}</td><td>${pill}</td><td>${e.updated_at || ''}</td>`;
    if (e.status === 'done' && e.year) tr.onclick = () => openReport(null, e.code, e.year);
    tb.appendChild(tr);
  });
  if (!(j.companies || []).length) tb.innerHTML = '<tr><td colspan="6" class="empty">暂无记录</td></tr>';
  const tb2 = $('t-industries').querySelector('tbody');
  tb2.innerHTML = '';
  (j.industries || []).forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.name}</td>`;
    tr.onclick = () => openReport(r.path);
    tb2.appendChild(tr);
  });
  if (!(j.industries || []).length) tb2.innerHTML = '<tr><td class="empty">暂无记录</td></tr>';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 极简 markdown 渲染：标题/加粗/列表/表格/引用/分隔线
function mdRender(md) {
  const lines = esc(md).split('\n');
  let html = '', inTable = false, listOpen = false;
  const closeAll = () => { if (inTable) { html += '</table>'; inTable = false; } if (listOpen) { html += '</ul>'; listOpen = false; } };
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i].trim();
    if (L.startsWith('|')) {
      const cells = L.split('|').slice(1, -1).map(c => c.trim());
      if (/^[\s\-:|]+$/.test(L)) continue;  // 表头分隔行
      if (!inTable) { html += '<table><thead><tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>'; inTable = true; continue; }
      html += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
      continue;
    }
    if (inTable) { html += '</table>'; inTable = false; }
    if (!L) { if (listOpen) { html += '</ul>'; listOpen = false; } continue; }
    if (/^####\s/.test(L)) { closeAll(); html += `<h3>${inline(L.slice(5))}</h3>`; }
    else if (/^###\s/.test(L)) { closeAll(); html += `<h3>${inline(L.slice(4))}</h3>`; }
    else if (/^##\s/.test(L)) { closeAll(); html += `<h2>${inline(L.slice(3))}</h2>`; }
    else if (/^#\s/.test(L)) { closeAll(); html += `<h1>${inline(L.slice(2))}</h1>`; }
    else if (/^---+$/.test(L)) { closeAll(); html += '<hr>'; }
    else if (/^>\s?/.test(L)) { closeAll(); html += `<blockquote>${inline(L.replace(/^>\s?/, ''))}</blockquote>`; }
    else if (/^[-*]\s/.test(L)) {
      if (!listOpen) { html += '<ul>'; listOpen = true; }
      html += `<li>${inline(L.slice(2))}</li>`;
    } else { closeAll(); html += `<p>${inline(L)}</p>`; }
  }
  closeAll();
  return html;
  function inline(s) {
    return s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }
}

async function openReport(path, code, year) {
  const q = path ? `path=${encodeURIComponent(path)}` : `code=${code}&year=${year}`;
  const j = await (await fetch('/api/report?' + q)).json();
  if (!j.ok) return banner(j.error, 'err');
  $('modal-title').textContent = j.path;
  $('modal-body').innerHTML = mdRender(j.content);
  $('overlay').classList.add('open');
}

loadIndustries();
</script>
</body>
</html>
